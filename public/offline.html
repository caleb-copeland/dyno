<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline · Dyno</title>
    <style>
        html,body{margin:0;height:100%;background:#0A0A0B;color:#F2F2F3;
            font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
            display:flex;align-items:center;justify-content:center;text-align:center;}
        .wrap{padding:24px;max-width:340px}
        .big{font-size:56px;margin-bottom:12px}
        .muted{color:#8A8A90;font-size:14px;line-height:1.5;margin-top:8px}
        .label{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600;color:#8A8A90}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="big">📴</div>
        <div class="label">Offline</div>
        <p class="muted">No connection. Pages and workouts you've already opened still work; any sets you check off are queued and sync when you're back online.</p>
    </div>
</body>
</html>
