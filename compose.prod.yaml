# Production stack — see DEPLOY.md.
#   docker compose -f compose.prod.yaml up -d --build
#
# Expects the external `frontend` network (shared with Traefik) and a `.env`
# based on .env.production.example. Dev keeps using compose.yaml (Sail); the
# explicit project name keeps the two stacks from colliding.
name: dyno-prod

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: dyno:prod
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        env_file: .env
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - frontend
            - internal
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/up']
            interval: 15s
            timeout: 5s
            start_period: 60s
            retries: 5
        labels:
            - traefik.enable=true
            # App is on two networks — pin the one Traefik should reach it on.
            - traefik.docker.network=frontend
            - traefik.http.routers.dyno-http.entrypoints=http
            - traefik.http.routers.dyno-http.rule=Host(`${APP_HOST:-dyno.gizmostash.com}`)
            - traefik.http.routers.dyno-http.middlewares=http-to-https-redirect@file
            - traefik.http.routers.dyno-https.tls=true
            - traefik.http.routers.dyno-https.entrypoints=https
            - traefik.http.routers.dyno-https.rule=Host(`${APP_HOST:-dyno.gizmostash.com}`)
            - traefik.http.routers.dyno-https.tls.certresolver=cloudflare
            # No authentik middleware — the app has its own invite login (§2/§3).
            - traefik.http.services.dyno.loadbalancer.server.port=8080

    # Runs the Laravel scheduler → fires app:send-reminders daily (push).
    scheduler:
        image: dyno:prod
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        env_file: .env
        environment:
            CONTAINER_ROLE: scheduler # entrypoint skips migrations
        command: ['php', 'artisan', 'schedule:work']
        depends_on:
            mysql:
                condition: service_healthy
            app:
                condition: service_healthy # migrations done
        networks:
            - internal

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        security_opt:
            - no-new-privileges:true
        # No published ports — reachable only on the internal network.
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:?DB_DATABASE must be set in .env}'
            MYSQL_USER: '${DB_USERNAME:?DB_USERNAME must be set in .env}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set in .env}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}'
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - internal
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u${DB_USERNAME}', '-p${DB_PASSWORD}']
            interval: 5s
            timeout: 5s
            start_period: 30s
            retries: 10

networks:
    frontend:
        external: true
    internal:
        driver: bridge

volumes:
    mysql-data: # database — persists across redeploys
